spring:
  application:
    name: courseinsight-server

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/courseinsight?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      connect-timeout: 2s
      timeout: 2s

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: courseinsight-analysis-producer
    send-message-timeout: 5000

courseinsight:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:CourseInsight Administrator}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:https://courseinsight.local}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    connect-timeout: 2s
    read-timeout: 90s
  rocketmq:
    analysis-topic: ${ROCKETMQ_ANALYSIS_TOPIC:courseinsight-analysis}
    analysis-consumer-group: ${ROCKETMQ_ANALYSIS_CONSUMER_GROUP:courseinsight-analysis-consumer}
    analysis-dead-letter-topic: ${ROCKETMQ_ANALYSIS_DLQ_TOPIC:%DLQ%courseinsight-analysis-consumer}
    analysis-dead-letter-consumer-group: ${ROCKETMQ_ANALYSIS_DLQ_CONSUMER_GROUP:courseinsight-analysis-dlq-consumer}
    send-timeout-ms: 5000
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:1000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    retry-delay-seconds: ${OUTBOX_RETRY_DELAY_SECONDS:30}
    recovery-timeout-seconds: ${OUTBOX_RECOVERY_TIMEOUT_SECONDS:300}
