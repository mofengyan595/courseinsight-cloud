spring:
  application:
    name: courseinsight-server

  datasource:
    url: jdbc:mysql://127.0.0.1:3307/courseinsight?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      connect-timeout: 2s
      timeout: 2s

courseinsight:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8001}
    connect-timeout: 2s
    read-timeout: 90s
