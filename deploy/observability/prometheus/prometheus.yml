global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: courseinsight-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  - job_name: rocketmq-broker
    metrics_path: /metrics
    scrape_interval: 1s
    static_configs:
      - targets:
          - rocketmq-broker:5557
