name: courseinsight-cloud

services:
  mysql:
    image: mysql:8.4
    container_name: courseinsight-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: courseinsight-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Docker creates named volumes as root; initialize them for RocketMQ's UID 3000.
  rocketmq-volume-init:
    image: apache/rocketmq:5.3.2
    container_name: courseinsight-rocketmq-volume-init
    user: "0:0"
    restart: "no"
    volumes:
      - rocketmq_nameserver_logs:/nameserver-logs
      - rocketmq_broker_logs:/broker-logs
      - rocketmq_broker_store:/broker-store
    entrypoint:
      - sh
      - -c
      - chown -R 3000:3000 /nameserver-logs /broker-logs /broker-store

  rocketmq-nameserver:
    image: apache/rocketmq:5.3.2
    container_name: courseinsight-rocketmq-nameserver
    restart: unless-stopped
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    depends_on:
      rocketmq-volume-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ROCKETMQ_NAMESERVER_PORT:-9876}:9876"
    volumes:
      - rocketmq_nameserver_logs:/home/rocketmq/logs
    command: sh mqnamesrv
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/9876'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: courseinsight-rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-nameserver:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    ports:
      - "127.0.0.1:${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "127.0.0.1:${ROCKETMQ_BROKER_FAST_PORT:-10909}:10909"
    volumes:
      - ./deploy/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
    command: >-
      sh mqbroker
      -n rocketmq-nameserver:9876
      -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c '</dev/tcp/127.0.0.1/10911'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai-service:
    build:
      context: ./courseinsight-ai-service
    container_name: courseinsight-ai-service
    restart: unless-stopped
    environment:
      SENTIMENT_BACKEND: ${SENTIMENT_BACKEND:-AUTO}
      BERT_MODEL_PATH: ${BERT_MODEL_PATH:-models/bert_model_final}
      BERT_DEVICE: ${BERT_DEVICE:-AUTO}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://chat.ecnu.edu.cn/open/api/v1}
      LLM_MODEL: ${LLM_MODEL:-ecnu-plus}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_RETRIES: ${LLM_RETRIES:-2}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8000"
    volumes:
      - ./courseinsight-ai-service/models/bert_model_final:/app/models/bert_model_final:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
  redis_data:
  rocketmq_nameserver_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
